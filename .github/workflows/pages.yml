name: Deploy NOOR to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate the site
        run: python scripts/check_site.py
      - name: Validate JavaScript
        run: node --check js/main.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Prepare the public site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R css js _site/
          cp -R assets _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5

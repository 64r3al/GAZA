name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: node --check js/main.js
      - name: Validate local assets and links
        run: python scripts/check_site.py
      - name: Install image optimization dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Build production assets
        run: python scripts/build_site.py
      - name: Validate generated production assets
        run: python scripts/check_site.py --root _site

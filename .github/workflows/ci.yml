name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: node --check js/main.js
      - name: Check story JavaScript syntax
        run: node --check js/story.js
      - name: Check archive JavaScript syntax
        run: node --check js/archive.js
      - name: Check map layout JavaScript syntax
        run: node --check js/archive-map-layout.js
      - name: Check interactive map JavaScript syntax
        run: node --check js/archive-map.js
      - name: Check research JavaScript syntax
        run: node --check js/research.js
      - name: Smoke-test archive filters and language controls
        run: node scripts/test_archive.js
      - name: Verify collision-free archive map layout
        run: node scripts/test_archive_map_layout.js
      - name: Test research navigation and methodology
        run: node scripts/test_research.js
      - name: Validate local assets and links
        run: python scripts/check_site.py
      - name: Install image optimization dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Build production assets
        run: python scripts/build_site.py
      - name: Validate generated production assets
        run: python scripts/check_site.py --root _site
